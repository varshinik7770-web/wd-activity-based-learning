<!DOCTYPE html>
<html>
<head>
    <title>Sweet Cake Bakery</title>
    <link rel="stylesheet" href="task 2.css">
</head>
<body>

    <header>
        <h1>Sweet Cake Bakery</h1>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="home">
        <h2>Welcome to Our Bakery</h2>
        <p>We sell fresh and delicious cakes.</p>
    </section>

    <section id="products">
        <h2>Our Products</h2>

        <div class="container">

            <div class="card">
                <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400" alt="Chocolate Cake">
                <h3>Chocolate Cake</h3>
                <p>Price: ₹500</p>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1486427944299-d1955d23e34d?w=400" alt="Cupcakes">
                <h3>Cupcakes</h3>
                <p>Price: ₹100</p>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1499636136210-6f4ee915583e?w=400" alt="Cookies">
                <h3>Cookies</h3>
                <p>Price: ₹150</p>
            </div>

        </div>
    </section>

    <section id="offer">
        <h2>Special Offer</h2>
        <p>Get 10% discount on cakes!</p>
    </section>

    <section id="contact">
        <h2>Contact Us</h2>
        <p>Email: bakery@example.com</p>
    </section>

    <footer>
        <p>Thank you for visiting!</p>
    </footer>

</body>
</html>
